name: Sync GitHub Profile README

on:
  push:
    branches:
      - main
    paths:
      - "github-profile/README.md"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-profile-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout GitHub profile repository
        uses: actions/checkout@v6
        with:
          repository: codesbysayam/codesbysayam
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo
          fetch-depth: 1

      - name: Sync profile README
        run: |
          set -e

          cp github-profile/README.md profile-repo/README.md

      - name: Commit and push profile README
        working-directory: profile-repo
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No profile README changes detected."
            exit 0
          fi

          git commit -m "docs: sync profile README"
          git push
