  <text x="876" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F4F4ED">COCO Class ID 0 Extraction · Non-Max Suppression (IoU 0.45)</text>

  <rect x="850" y="376" width="646" height="84" rx="8" fill="#151713" stroke="#69734A" stroke-width="1.5"/>
  <text x="876" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#C7E34A">STAGE 02 · YOLOv8 POSE ESTIMATION</text>
  <text x="876" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F4F4ED">17 COCO Body Keypoints + Confidence Vectors per ROI</text>

  <rect x="850" y="480" width="646" height="84" rx="8" fill="#151713" stroke="#C7E34A" stroke-width="1.8"/>
  <text x="876" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#C7E34A">STAGE 03 · BYTETRACK ASSOCIATION</text>
  <text x="876" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F4F4ED">Persistent Multi-Object Identity Assignment + Occlusion Recovery</text>

  <rect x="850" y="584" width="646" height="100" rx="8" fill="#151713" stroke="#41443A" stroke-width="1.5"/>
  <text x="876" y="614" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#EAEAE1">STAGE 04 · POSTGRESQL + TELEMETRY STREAM</text>
  <text x="876" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B5B8AA">TypeScript 252.1 KB · Python 149.6 KB · CSS 4.7 KB · Makefile 2.5 KB</text>
  <text x="876" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8D947E">github.com/codesbysayam/SightForge · Local / Self-Hosted Dual Runtime</text>

  <!-- Footer -->
  <text x="72" y="790" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8D947E">VERIFIED REPOSITORY 03 / 08 · REAL-TIME EDGE COMPUTER VISION</text>
  <text x="1528" y="790" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C7E34A" text-anchor="end">COCO-0 + 17 KEYPOINTS + BYTETRACK</text>
