<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="OPERON Multi-Agent Operations and Human-in-the-Loop Architecture">
  <defs>
    <pattern id="grid-op" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#41443A" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C7E34A"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8D947E"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#151713"/>
  <rect width="1600" height="900" fill="url(#grid-op)"/>

  <!-- Header Bar -->
  <rect x="72" y="56" width="1456" height="68" rx="10" fill="#20231D" stroke="#41443A" stroke-width="1.5"/>
  <rect x="96" y="74" width="108" height="32" rx="4" fill="#C7E34A"/>
  <text x="150" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#151713" text-anchor="middle" letter-spacing="1.2">OPERON</text>
  <text x="228" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#F4F4ED">Multi-Agent Operations Platform &amp; Approval State Machine</text>
  <text x="1496" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B5B8AA" text-anchor="end">TEAM NEXUS · DEPLOY OR DIE</text>

  <!-- Ingress Dispatcher -->
  <rect x="72" y="180" width="320" height="530" rx="12" fill="#20231D" stroke="#41443A" stroke-width="1.5"/>
  <text x="102" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#C7E34A" letter-spacing="1.5">01 · TASK DISPATCHER</text>
  <text x="102" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#F4F4ED">Role-Scoped Agents</text>
  <text x="102" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B5B8AA">TypeScript · Node/Express</text>

  <!-- 4 Role Cards -->
  <rect x="102" y="312" width="260" height="76" rx="8" fill="#151713" stroke="#69734A" stroke-width="1.5"/>
  <circle cx="126" cy="340" r="6" fill="#C7E34A"/>
  <text x="144" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F4F4ED">SUPPORT AGENT</text>
  <text x="144" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B5B8AA">Ticket triage &amp; escalation</text>

  <rect x="102" y="404" width="260" height="76" rx="8" fill="#151713" stroke="#69734A" stroke-width="1.5"/>
  <circle cx="126" cy="432" r="6" fill="#C7E34A"/>
  <text x="144" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F4F4ED">FINANCE AGENT</text>
  <text x="144" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B5B8AA">Ledger &amp; payout validation</text>

  <rect x="102" y="496" width="260" height="76" rx="8" fill="#151713" stroke="#41443A" stroke-width="1.5"/>
  <circle cx="126" cy="524" r="6" fill="#8D947E"/>
  <text x="144" y="529" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F4F4ED">HR AGENT</text>
  <text x="144" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B5B8AA">Onboarding &amp; policy handoffs</text>

  <rect x="102" y="588" width="260" height="76" rx="8" fill="#151713" stroke="#41443A" stroke-width="1.5"/>
  <circle cx="126" cy="616" r="6" fill="#8D947E"/>
  <text x="144" y="621" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#F4F4ED">OPS AGENT</text>
  <text x="144" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B5B8AA">Runbooks &amp; SLA coordination</text>

