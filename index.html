<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sayam Mukherjee — Engineering Portfolio &amp; Ecosystem</title>
    <meta name="description" content="An evidence-based engineering portfolio and ecosystem showcasing verified projects, technologies, repository telemetry, and system architecture by Sayam Mukherjee." />
    <meta name="theme-color" content="#09090b" />
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Sayam Mukherjee — Engineering Portfolio &amp; Ecosystem" />
    <meta property="og:description" content="An evidence-based engineering portfolio and ecosystem showcasing verified projects, technologies, repository telemetry, and system architecture by Sayam Mukherjee." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sayam Mukherjee — Engineering Portfolio" />
    <meta name="twitter:description" content="Undergraduate software developer focusing on AI, full-stack architectures, and algorithms." />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      (function() {
        try {
          var isMobile = window.matchMedia("(pointer: coarse)").matches;
          var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var mode = (reducedMotion || isMobile) ? "reduced" : "full";
          document.documentElement.dataset.performance = mode;

          var savedTheme = localStorage.getItem("sayam_theme") || localStorage.getItem("theme");
          if (savedTheme === "light" || (!savedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)) {
            document.documentElement.classList.add("light");
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          } else {
            document.documentElement.classList.remove("light");
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
