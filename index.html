    <meta property="og:title" content="Remix: Sayam Mukherjee — Interactive AI Portfolio" />
    <meta property="og:description" content="A high-fidelity, living digital ecosystem and AI-powered portfolio showcasing the skills, projects, and learning journey of Sayam Mukherjee." />
    <script>
      (function() {
        try {
          var isMobile = window.matchMedia("(pointer: coarse)").matches;
          var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var mode = (reducedMotion || isMobile) ? "reduced" : "full";
          document.documentElement.dataset.performance = mode;
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
